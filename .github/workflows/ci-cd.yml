name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  security-gates:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Security Pattern Check
        run: |
          echo "Checking for forbidden patterns..."
          if grep -rn "resolve\\|ns-resolve\\|find-var" src/; then
            echo "ERROR: Dynamic resolution detected"
            exit 1
          fi
          if grep -rn "symbol.*str\\|symbol.*join" src/; then
            echo "ERROR: String-constructed symbols detected"
            exit 1
          fi
          echo "✓ Security checks passed"
